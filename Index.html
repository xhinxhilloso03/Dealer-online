<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="TOCHINCHI: catálogo de productos de Pachuca de Soto, Hidalgo, México.">
  <title>TOCHINCHI | Catálogo urbano</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet">

  <style>
    :root {
      --fondo: #050505;
      --panel: #121212;
      --panel-claro: #1d1d1d;
      --texto: #ffffff;
      --suave: #d5d5d5;
      --rosa: #ff35c8;
      --naranja: #ff9f1c;
      --amarillo: #caff00;
      --verde: #caff00;
      --azul: #f5f5f5;
      --morado: #6dff00;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--texto);
      background:
        radial-gradient(circle at 8% 8%, #caff0022 0 3px, transparent 4px),
        radial-gradient(circle at 15% 19%, #ff35c822 0 5px, transparent 6px),
        radial-gradient(circle at 91% 13%, #ffffff1c 0 4px, transparent 5px),
        radial-gradient(circle at 86% 34%, #caff0020 0 6px, transparent 7px),
        radial-gradient(circle at 5% 52%, #ff35c81a 0 5px, transparent 6px),
        radial-gradient(circle at 96% 68%, #ffffff14 0 4px, transparent 5px),
        radial-gradient(circle at 12% 86%, #caff001c 0 6px, transparent 7px),
        radial-gradient(ellipse at 12% 4%, #caff0010, transparent 28rem),
        #050505;
      font-family: "Arial Black", "Impact", "Trebuchet MS", Arial, sans-serif;
      min-height: 100vh;
    }

    .top-glow {
      height: 8px;
      background: linear-gradient(90deg, #caff00, #ffffff, #ff35c8, #caff00);
      background-size: 200% 100%;
      animation: rainbow 8s linear infinite;
    }

    header {
      position: relative;
      overflow: hidden;
      text-align: center;
      padding: 30px 16px 28px;
      border-bottom: 1px solid #ffffff18;
      background:
        radial-gradient(circle at 12% 28%, #caff0030 0 5px, transparent 6px),
        radial-gradient(circle at 85% 18%, #ff35c82b 0 6px, transparent 7px),
        radial-gradient(circle at 78% 76%, #ffffff18 0 4px, transparent 5px),
        radial-gradient(ellipse at 50% 0%, #caff0012, transparent 65%),
        #050505;
    }

    header::before, header::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 44% 56% 62% 38%;
      filter: blur(1px);
      opacity: .28;
      pointer-events: none;
    }

    header::before {
      left: -70px; top: -55px;
      background: var(--verde);
      transform: rotate(25deg);
    }

    header::after {
      right: -65px; bottom: -90px;
      background: var(--rosa);
      transform: rotate(-28deg);
    }

    .brand-logo {
      position: relative;
      z-index: 1;
      display: block;
      width: min(94vw, 510px);
      height: auto;
      margin: -10px auto -24px;
      border: 0;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px #000b);
    }

    .brand {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      flex-wrap: nowrap;
      gap: clamp(0px, .45vw, 5px);
      margin: 0;
      font-family: "Fredoka", "Trebuchet MS", Arial, sans-serif;
      font-size: clamp(2.05rem, 9.5vw, 5.7rem);
      font-weight: 700;
      letter-spacing: -.055em;
      line-height: 1.08;
      isolation: isolate;
      filter: drop-shadow(0 13px 8px #0007);
      z-index: 1;
    }

    .bubble {
      position: relative;
      display: inline-block;
      min-width: .53em;
      padding: 0 .015em .04em;
      border-radius: 42% 48% 38% 44%;
      color: var(--bubble-light, #fff);
      -webkit-text-stroke: 1.3px #fff6ff;
      text-shadow:
        0 -1px 1px #ffffffbb,
        1px 1px 0 var(--bubble-edge, #8b277f),
        2px 2px 0 var(--bubble-edge, #8b277f),
        3px 3px 0 var(--bubble-shadow, #57205e),
        4px 4px 0 var(--bubble-shadow, #57205e),
        5px 6px 0 #32143f,
        0 8px 12px #0008;
      background: linear-gradient(145deg, #ffffff 0%, var(--bubble-light, #ffb9ec) 13%, var(--bubble-main, #ff48c4) 42%, var(--bubble-main, #ff48c4) 62%, var(--bubble-edge, #8b277f) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      transform: rotate(var(--tilt, 0deg));
      filter: drop-shadow(inset 0 0 0 transparent);
    }

    .bubble::before {
      content: "";
      position: absolute;
      z-index: -1;
      left: 16%;
      top: 8%;
      width: 27%;
      height: 12%;
      border-radius: 50%;
      background: #ffffffb8;
      filter: blur(1px);
      transform: rotate(-30deg);
    }

    /* Pequeñas gotas para que las letras recuerden a globos derretidos */
    .bubble::after {
      content: "";
      position: absolute;
      z-index: -2;
      left: 40%;
      bottom: -0.11em;
      width: .19em;
      height: .24em;
      border-radius: 0 0 55% 55%;
      background: linear-gradient(90deg, var(--bubble-main), var(--bubble-edge));
      box-shadow: 2px 3px 0 var(--bubble-shadow);
    }

    .b1 { --bubble-light: #ffc4f0; --bubble-main: #ff48c4; --bubble-edge: #bc238c; --bubble-shadow: #72135d; --tilt: -7deg; }
    .b2 { --bubble-light: #ffe8a6; --bubble-main: #ff9f1c; --bubble-edge: #c45a13; --bubble-shadow: #78310f; --tilt: 4deg; }
    .b3 { --bubble-light: #ffffa5; --bubble-main: #eaff27; --bubble-edge: #a6b500; --bubble-shadow: #596000; --tilt: -3deg; }
    .b4 { --bubble-light: #bdffd0; --bubble-main: #55f58b; --bubble-edge: #159b54; --bubble-shadow: #075b37; --tilt: 5deg; }
    .b5 { --bubble-light: #c7fbff; --bubble-main: #38e8ff; --bubble-edge: #128fae; --bubble-shadow: #07546d; --tilt: -4deg; }
    .b6 { --bubble-light: #dfcaff; --bubble-main: #a66bff; --bubble-edge: #7037bd; --bubble-shadow: #43206f; --tilt: 4deg; }
    .b7 { --bubble-light: #ffc4f0; --bubble-main: #ff48c4; --bubble-edge: #bc238c; --bubble-shadow: #72135d; --tilt: -4deg; }
    .b8 { --bubble-light: #ffe8a6; --bubble-main: #ff9f1c; --bubble-edge: #c45a13; --bubble-shadow: #78310f; --tilt: 5deg; }
    .b9 { --bubble-light: #c7fbff; --bubble-main: #38e8ff; --bubble-edge: #128fae; --bubble-shadow: #07546d; --tilt: -5deg; }

    .brand-wrap { position: relative; display: inline-block; }
    .brand-wrap::after {
      content: "";
      position: absolute;
      left: 18%; right: 18%; bottom: 4px;
      height: 18px;
      background: linear-gradient(90deg, var(--verde), #fff, var(--rosa));
      border-radius: 45% 55% 65% 35%;
      filter: blur(16px);
      opacity: .38;
      z-index: 0;
    }

    .location {
      position: relative;
      z-index: 1;
      margin: 12px 0 5px;
      font-weight: 600;
      font-size: clamp(1rem, 3.6vw, 1.2rem);
      color: #fff;
      text-shadow: 0 2px 12px #ff48c477;
    }

    .tagline {
      position: relative;
      z-index: 1;
      margin: 0;
      color: #e6d4f2;
      font-size: .98rem;
    }

    .container { width: min(1120px, 100%); margin: auto; padding: 22px 14px 42px; }

    .welcome {
      position: relative;
      overflow: hidden;
      padding: 22px;
      margin-bottom: 20px;
      border: 1px solid #ffffff1c;
      border-radius: 22px;
      background: radial-gradient(circle at 94% 18%, #caff0022 0 5px, transparent 6px), linear-gradient(135deg, #1a1a1a, #0b0b0b 70%);
      box-shadow: 0 12px 35px #0003, inset 0 1px 0 #ffffff12;
    }

    .welcome::after {
      content: "✦";
      position: absolute;
      right: 20px;
      top: 3px;
      font-size: 4.5rem;
      color: #ff9f1c66;
      transform: rotate(15deg);
    }

    .welcome h2 {
      margin: 0 0 7px;
      font-size: clamp(1.45rem, 5vw, 2rem);
      line-height: 1.15;
      color: #fff;
      text-shadow: 2px 3px 0 #a32d9c, 4px 5px 0 #51285f;
    }

    .welcome p { margin: 0; max-width: 38rem; color: var(--suave); line-height: 1.55; }

    .search-wrap { position: relative; margin: 0 0 15px; }
    .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 1.1rem; }
    #search {
      width: 100%;
      padding: 15px 16px 15px 44px;
      border: 1px solid #ffffff25;
      border-radius: 16px;
      outline: none;
      color: var(--texto);
      background: #111111;
      font: inherit;
      font-size: 1rem;
      box-shadow: inset 0 2px 8px #0002;
    }
    #search::placeholder { color: #b8a6c7; }
    #search:focus { border-color: var(--azul); box-shadow: 0 0 0 3px #38e8ff20; }

    .categories {
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding: 3px 1px 14px;
      scrollbar-width: thin;
      scrollbar-color: #a66bff #21152e;
    }

    .category-btn {
      flex: 0 0 auto;
      padding: 10px 15px;
      border-radius: 999px;
      border: 1px solid #ffffff24;
      color: #f8ecff;
      background: #251632;
      font: 600 .94rem "Fredoka", sans-serif;
      cursor: pointer;
      transition: transform .18s, border-color .18s, background .18s;
    }
    .category-btn:hover { transform: translateY(-2px); border-color: var(--rosa); }
    .category-btn.active {
      color: #190d21;
      border-color: transparent;
      background: linear-gradient(100deg, var(--verde), #ffffff);
      box-shadow: 0 4px 16px #caff0033;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 13px 2px 15px;
    }
    .section-heading h2 {
      margin: 0;
      font-size: clamp(1.35rem, 4.5vw, 1.8rem);
      color: #fff;
      text-shadow: 2px 3px 0 #702c7c;
    }
    #count { color: #cbb8dc; font-size: .9rem; white-space: nowrap; }

    .products { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }

    .product {
      min-width: 0;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid #ffffff18;
      background: linear-gradient(160deg, #202020, #101010);
      box-shadow: 0 8px 22px #0002;
      transition: transform .2s, border-color .2s, box-shadow .2s;
    }
    .product:hover { transform: translateY(-3px); border-color: #ff48c466; box-shadow: 0 12px 25px #0004; }

    .product-art {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 135px;
      font-size: 3.4rem;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 25% 20%, #ffffff75, transparent 22%), linear-gradient(135deg, #ff55c8, #a66bff 50%, #38e8ff);
    }
    .product:nth-child(6n+2) .product-art { background: radial-gradient(circle at 25% 20%, #ffffff75, transparent 22%), linear-gradient(135deg, #ff9f1c, #ff48c4); }
    .product:nth-child(6n+3) .product-art { background: radial-gradient(circle at 25% 20%, #ffffff75, transparent 22%), linear-gradient(135deg, #6dff8b, #38e8ff); }
    .product:nth-child(6n+4) .product-art { background: radial-gradient(circle at 25% 20%, #ffffff75, transparent 22%), linear-gradient(135deg, #faff00, #ff9f1c); }
    .product:nth-child(6n+5) .product-art { background: radial-gradient(circle at 25% 20%, #ffffff75, transparent 22%), linear-gradient(135deg, #a66bff, #ff48c4); }
    .product:nth-child(6n) .product-art { background: radial-gradient(circle at 25% 20%, #ffffff75, transparent 22%), linear-gradient(135deg, #38e8ff, #6dff8b); }
    .product-art::after {
      content: "";
      position: absolute;
      width: 115px;
      height: 115px;
      border: 2px solid #ffffff55;
      border-radius: 42% 58% 61% 39%;
      transform: rotate(25deg);
    }
    .product-emoji { position: relative; z-index: 1; filter: drop-shadow(0 5px 3px #0003); }

    .product-info { padding: 13px; }
    .product-category { display: inline-block; color: #ffb6eb; font-size: .76rem; margin-bottom: 6px; }
    .product-info h3 { margin: 0 0 6px; font-size: 1.05rem; line-height: 1.2; overflow-wrap: anywhere; }
    .description { min-height: 34px; margin: 0; color: #cbbbd8; font-size: .84rem; line-height: 1.4; overflow-wrap: anywhere; }
    .price { margin: 12px 0; font-weight: 700; font-size: 1.05rem; color: var(--yellow, #faff00); }
    .order-btn {
      width: 100%;
      padding: 11px 8px;
      border: 0;
      border-radius: 11px;
      color: #1a1020;
      background: linear-gradient(100deg, #6dff8b, #38e8ff);
      font: 700 .88rem "Fredoka", sans-serif;
      cursor: pointer;
      transition: filter .2s, transform .2s;
    }
    .order-btn:hover { filter: brightness(1.08); transform: scale(1.02); }

    .empty {
      grid-column: 1 / -1;
      padding: 30px 18px;
      text-align: center;
      color: var(--suave);
      background: #111111;
      border: 1px dashed #ffffff35;
      border-radius: 18px;
    }

    footer {
      text-align: center;
      padding: 25px 15px 30px;
      border-top: 1px solid #ffffff18;
      background: #030303;
      color: #cbbbd8;
      font-size: .9rem;
    }
    .footer-brand {
      font-family: "Fredoka", sans-serif;
      font-weight: 700;
      font-size: 1.7rem;
      letter-spacing: .04em;
      color: #caff00;
      -webkit-text-stroke: .5px #fff;
      text-shadow: 1px 1px 0 #527000, 2px 2px 0 #263600, 3px 4px 0 #111;
    }
    footer p { margin: 7px 0 0; }

    @keyframes rainbow { 0% { background-position: 0% 50%; } 100% { background-position: 220% 50%; } }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-4px) rotate(1deg); } }

    @media (min-width: 620px) {
      .container { padding: 28px 22px 50px; }
      .products { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 17px; }
      .product-art { min-height: 165px; font-size: 4rem; }
    }
    @media (min-width: 930px) {
      .products { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      header { padding-top: 24px; padding-bottom: 30px; }
      .brand-logo { width: min(88vw, 560px); margin-top: -14px; margin-bottom: -28px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }

    /* TOCHINCHI: identidad urbana negro, blanco y verde ácido */
    :root { --rosa:#caff00; --naranja:#caff00; --amarillo:#caff00; --verde:#caff00; --azul:#ffffff; --morado:#caff00; }
    body { background-color:#050505; background-image: radial-gradient(circle at 8% 8%, #caff0030 0 3px, transparent 4px), radial-gradient(circle at 15% 19%, #ffffff20 0 3px, transparent 4px), radial-gradient(circle at 91% 13%, #caff0020 0 4px, transparent 5px), radial-gradient(circle at 86% 34%, #ffffff18 0 4px, transparent 5px), radial-gradient(circle at 5% 52%, #caff0018 0 4px, transparent 5px), radial-gradient(circle at 96% 68%, #ffffff14 0 4px, transparent 5px), #050505; }
    .top-glow { height:5px; background:repeating-linear-gradient(115deg,#caff00 0 32px,#fff 32px 38px,#111 38px 58px); animation:none; }
    header { background: radial-gradient(circle at 12% 28%,#caff0020 0 5px,transparent 6px), radial-gradient(circle at 85% 18%,#ffffff16 0 5px,transparent 6px), #050505; }
    header::after { background:#caff00; }
    .brand-wrap::after { background:linear-gradient(90deg,#caff00,#fff,#caff00); }
    .location { text-shadow:2px 2px 0 #000; }
    .tagline { color:#caff00; font-weight:800; text-transform:uppercase; letter-spacing:.06em; }
    .welcome { border-color:#caff00; background:linear-gradient(135deg,#151515,#080808); }
    .welcome h2, .section-title, .footer-brand { font-family:Impact,"Arial Black",sans-serif; text-transform:uppercase; letter-spacing:.015em; }
    .welcome h2 { text-shadow:3px 3px 0 #333; }
    .search-wrap input, .search-wrap { border-color:#ffffff35; }
    .category, .category-card, .product { border-color:#ffffff35 !important; }
    .category:hover, .category.active, .product:hover { border-color:#caff00 !important; }
    .product { background:linear-gradient(160deg,#191919,#080808); }
    .product:hover { box-shadow:0 12px 25px #caff0020; }
    .product-art, .product:nth-child(n) .product-art { background:radial-gradient(circle at 25% 20%,#ffffff35,transparent 22%),linear-gradient(135deg,#202020,#080808) !important; }
    .product-category { color:#caff00; }
    .btn, button, .whatsapp-button, .product button { border-radius:5px; font-weight:900; text-transform:uppercase; }
    .footer { border-top:2px solid #caff00; }
    a:focus-visible, button:focus-visible, input:focus-visible { outline:2px solid #caff00; outline-offset:3px; }
    @media (max-width:600px) { .brand-logo { width:min(94vw,440px); } }

  </style>
</head>

        { name: "Producto 1", description: "Descripción del producto.", price: 0, emoji: "🔥" },
        { name: "Producto 2", description: "Descripción del producto.", price: 0, emoji: "⚡" },
        { name: "Producto 3", description: "Descripción del producto.", price: 0, emoji: "☀️" },
        { name: "Producto 4", description: "Descripción del producto.", price: 0, emoji: "🌙" },
        { name: "Producto 5", description: "Descripción del producto.", price: 0, emoji: "🪐" },
        { name: "Producto 6", description: "Descripción del producto.", price: 0, emoji: "🚀" }
      ]},
      { name: "Categoría 6", emoji: "💎", products: [
        { name: "Producto 1", description: "Descripción del producto.", price: 0, emoji: "💎" },
        { name: "Producto 2", description: "Descripción del producto.", price: 0, emoji: "🌀" },
        { name: "Producto 3", description: "Descripción del producto.", price: 0, emoji: "🍄" },
        { name: "Producto 4", description: "Descripción del producto.", price: 0, emoji: "🧿" },
        { name: "Producto 5", description: "Descripción del producto.", price: 0, emoji: "🌈" },
        { name: "Producto 6", description: "Descripción del producto.", price: 0, emoji: "🪄" }
      ]}
    ];

    const categoriesEl = document.getElementById("categories");
    const productsEl = document.getElementById("products");
    const searchEl = document.getElementById("search");
    const titleEl = document.getElementById("section-title");
    const countEl = document.getElementById("count");
    let activeCategory = "Todas";

    document.getElementById("year").textContent = new Date().getFullYear();

    function renderCategories() {
      categoriesEl.replaceChildren();
      ["Todas", ...categories.map(category => category.name)].forEach(name => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "category-btn" + (activeCategory === name ? " active" : "");
        button.textContent = name;
        button.setAttribute("aria-pressed", String(activeCategory === name));
        button.addEventListener("click", () => {
          activeCategory = name;
          renderCategories();
          renderProducts();
        });
        categoriesEl.appendChild(button);
      });
    }

    function makeElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function renderProducts() {
      productsEl.replaceChildren();
      const query = searchEl.value.trim().toLocaleLowerCase("es-MX");
      const matches = [];

      categories.forEach(category => {
        if (activeCategory !== "Todas" && activeCategory !== category.name) return;
        category.products.forEach((product, index) => {
          const searchable = `${product.name} ${product.description} ${category.name}`.toLocaleLowerCase("es-MX");
          if (searchable.includes(query)) {
            matches.push({ ...product, category: category.name, categoryEmoji: category.emoji, number: index + 1 });
          }
        });
      });

      titleEl.textContent = activeCategory === "Todas" ? "Todos los productos" : activeCategory;
      countEl.textContent = `${matches.length} ${matches.length === 1 ? "producto" : "productos"}`;

      if (!matches.length) {
        productsEl.appendChild(makeElement("div", "empty", "No encontramos productos. Prueba otra búsqueda o categoría."));
        return;
      }

      matches.forEach(product => {
        const card = makeElement("article", "product");
        const art = makeElement("div", "product-art");
        art.setAttribute("aria-hidden", "true");
        art.appendChild(makeElement("span", "product-emoji", product.emoji || product.categoryEmoji));

        const info = makeElement("div", "product-info");
        info.appendChild(makeElement("span", "product-category", product.category));
        info.appendChild(makeElement("h3", "", product.name));
        info.appendChild(makeElement("p", "description", product.description));

        const priceText = product.price > 0
          ? new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN" }).format(product.price)
          : "Consultar precio";
        info.appendChild(makeElement("p", "price", priceText));

        const order = makeElement("button", "order-btn", "Pedir por WhatsApp");
        order.type = "button";
        order.addEventListener("click", () => {
          if (WHATSAPP === "5210000000000" || !/^\d{10,15}$/.test(WHATSAPP)) {
            alert("Antes de usar los pedidos, reemplaza WHATSAPP en el código por tu número con código de país, sin espacios ni signos.");
            return;
          }
          const message = [
            "¡Hola! Me interesa un producto de TOCHINCHI.",
            `Producto: ${product.name}`,
            `Categoría: ${product.category}`,
            `Precio: ${priceText}`,
            "¿Me puedes dar más información?"
          ].join("\n");
          window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(message)}`, "_blank", "noopener,noreferrer");
        });

        info.appendChild(order);
        card.append(art, info);
        productsEl.appendChild(card);
      });
    }

    searchEl.addEventListener("input", renderProducts);
    renderCategories();
    renderProducts();
  </script>
</body>
</html>
